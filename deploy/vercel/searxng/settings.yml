use_default_settings: true

server:
  # Overridden at runtime by SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0

search:
  formats:
    - json

engines:
  - name: duckduckgo
    disabled: true
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
